<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>世界史クリックマップ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
  <style>
    body { margin:0; font-family:sans-serif; }
    #controls {
      padding:10px;
      background:#111;
      color:white;
    }
    button {
      margin-right:5px;
      padding:6px 10px;
      cursor:pointer;
    }
    #map { height:90vh; }
  </style>
</head>
<body>

<div id="controls">
  <b>時代選択：</b>
  <button onclick="loadEra('medieval')">中世</button>
  <button onclick="loadEra('early')">近世／近代</button>
  <button onclick="loadEra('modern')">現代</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="main.js"></script>
</body>
</html>
