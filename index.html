<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>World Conflict Map by Era</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
  <style>
    body { margin:0; font-family:sans-serif; }
    #controls { padding:10px; background:#111; color:white; }
    button { margin-right:5px; padding:6px 10px; }
    #map { height:90vh; }
  </style>
</head>
<body>

<div id="controls">
  <b>時代選択：</b>
  <button onclick="loadEra('medieval')">中世</button>
  <button onclick="loadEra('early')">近世</button>
  <button onclick="loadEra('modern')">現代</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([20, 0], 2);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
  .addTo(map);

let markers = [];

const wars = {
  medieval: [
    {
      name: "十字軍戦争",
      lat: 31.8,
      lon: 35.2,
      year: "1096–1291",
      cause: "キリスト教とイスラム教の宗教対立。聖地エルサレムの支配権を巡る争いと、教皇権力拡大が背景。"
    },
    {
      name: "百年戦争",
      lat: 48.8,
      lon: 2.3,
      year: "1337–1453",
      cause: "イングランド王がフランス王位を主張したことによる王権・領土争い。"
    }
  ],

  early: [
    {
      name: "三十年戦争",
      lat: 50,
      lon: 10,
      year: "1618–1648",
      cause: "宗教改革後のカトリックとプロテスタントの対立が国家間戦争に拡大。"
    },
    {
      name: "スペイン継承戦争",
      lat: 40,
      lon: -3,
      year: "1701–1714",
      cause: "王位継承問題とヨーロッパ列強の勢力均衡争い。"
    }
  ],

  modern: [
    {
      name: "ウクライナ戦争",
      lat: 49,
      lon: 32,
      year: "2014–現在",
      cause: "ロシアによる領土侵攻。NATO拡大への警戒と旧ソ連圏支配を巡る対立。"
    },
    {
      name: "イスラエル・ガザ戦争",
      lat: 31.5,
      lon: 34.5,
      year: "2023–現在",
      cause: "領土・民族・宗教問題の長期対立。ハマスとイスラエル政府の武力衝突。"
    },
    {
      name: "スーダン内戦",
      lat: 15.6,
      lon: 32.5,
      year: "2023–現在",
      cause: "正規軍と準軍事組織RSFの権力闘争。民主化失敗が背景。"
    },
    {
      name: "ミャンマー内戦",
      lat: 21,
      lon: 96,
      year: "2021–現在",
      cause: "軍事クーデター後、民主派・少数民族武装勢力との全面対立。"
    },
    {
      name: "イエメン内戦",
      lat: 15,
      lon: 48,
      year: "2014–現在",
      cause: "政府とフーシ派反政府勢力の内戦。周辺国の介入で長期化。"
    }
  ]
};

function loadEra(era) {
  markers.forEach(m => map.removeLayer(m));
  markers = [];

  wars[era].forEach(w => {
    const marker = L.marker([w.lat, w.lon]).addTo(map)
      .bindPopup(
        `<b>${w.name}</b><br>
         年代：${w.year}<br><br>
         原因：${w.cause}`
      );
    markers.push(marker);
  });
}

loadEra('modern');
</script>

</body>
</html>
